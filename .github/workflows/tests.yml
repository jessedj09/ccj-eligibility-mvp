# push·PR마다 전체 테스트를 돌린다. master에 push하면 Streamlit Cloud가 바로 배포하므로,
# 실패 표시(빨간 X)를 보고 배포본을 되돌리거나 고칠 수 있게 하는 안전망이다.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 공유 저장소 시험(tests/test_d4_store.py) — 운영 DB(Neon)가 아닌 일회용 PostgreSQL
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-api.txt   # requirements.txt + 판정 API(테스트용 fastapi·httpx)
      - name: PDF text cache
        # 공고문 PDF 추출 텍스트(src/source_verify.py) — PDF·추출 코드·의존성이 같으면 재사용. 키가 바뀌면 다시 추출한다.
        uses: actions/cache@v4
        with:
          path: .cache/pdf_text
          key: pdf-text-${{ hashFiles('sample_lh/**/*.pdf', 'sample_sh/**/*.pdf', 'src/source_verify.py', 'requirements*.txt') }}
      - name: Source verification (rules vs notice PDFs)
        run: python tools/verify_sources.py
      - name: pytest
        run: python -m pytest -q

  ui-smoke:
    # 화면 헤드리스 점검(2~4분). 테스트가 통과한 뒤에만 돈다.
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: UI smoke
        run: python tools/ui_smoke.py

  docker:
    # 판정 API 배포 이미지(Render와 같은 Dockerfile)가 만들어지고, 떠서 업로드 판정까지 되는지.
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t ccj-api .
      - name: Run and check
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 ccj-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          docker exec -i api python - <<'PY'
          import sys, httpx
          sys.path.insert(0, "src")
          import source_verify as sv
          p = sv.pdf_path("N12")
          j = httpx.post("http://127.0.0.1:8000/upload", files={"file": (p.name, p.read_bytes(), "application/pdf")}, timeout=120).json()
          assert j["judge"]["by"] == "registered" and j["judge"]["notice_id"] == "N12", j
          body = {"age": 25, "marital_status": "미혼", "home_ownership": "무주택", "household_size": 1}
          r = httpx.post("http://127.0.0.1:8000/evaluate", json={"notice_id": "N12", "layer": "청년", "profile": body}, timeout=60).json()
          assert r["display"]["group"] and r["common_note"], r
          print("upload →", j["judge"]["by"], "| evaluate →", r["verdict"])
          PY
      - name: Logs
        if: always()
        run: docker logs api || true
