# Render 블루프린트 — 판정 API(Docker). Render 대시보드 → New → Blueprint에서 이 저장소를 고르면 만들어진다.
# 비밀 값(DATABASE_URL·CCJ_CORS_ORIGINS)은 sync: false — 대시보드에서 직접 넣는다(저장소에 두지 않음).
services:
  - type: web
    name: ccj-api
    runtime: docker
    region: singapore          # Neon(AWS 싱가포르)과 같은 지역
    plan: free                 # 개발·시험 중 무료(15분 쉬면 잠듦) → 베타 공개 때 starter(월 $7, 잠들지 않음)
    branch: master
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CCJ_CORS_ORIGINS
        sync: false
      - key: CCJ_AUTO_JUDGE_PUBLIC
        value: "1"             # 미등록 공고 자동 판정 공개(2026-11-01 사용자 결정 — 지원 사업만 판정, 나머지는 이유 안내)
      # 회원가입·내 조건(2026-11-03) — 비밀 값은 대시보드에서. 없으면 그 기능만 멈춘다(판정은 그대로).
      - key: CCJ_PROFILE_KEY      # 내 조건 암호화 키(32바이트 urlsafe base64) — 만드는 명령·주의는 docs/11-account-setup.md. 분실·변경하면 저장한 조건을 못 연다
        sync: false
      - key: CCJ_MAIL_BACKEND     # resend(운영) — 비우면 가입·비밀번호 재설정이 503
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CCJ_MAIL_FROM        # 보내는 주소(도메인 인증 뒤, 베타 전)
        sync: false
